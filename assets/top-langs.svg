    <rect data-role="composition-part" data-language="Other" data-share="1.9426" x="369.16" y="82" width="6.84" height="78" fill="#dce9f1" stroke="#fef7ef" stroke-width="2"/>
  </g>
  <g data-role="legend" data-columns="2">
    <circle cx="28" cy="190" r="4" fill="#024b81"/>
