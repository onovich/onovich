    <rect data-role="composition-part" data-language="Python" data-share="4.6611" x="341.27" y="100" width="16.41" height="78" fill="#fed9da" stroke="#fef7ef" stroke-width="2"/>
    <rect data-role="composition-part" data-language="CSS" data-share="1.542" x="357.68" y="100" width="5.43" height="78" fill="#fd7136" stroke="#fef7ef" stroke-width="2"/>
    <rect data-role="composition-part" data-language="Other" data-share="3.6623" x="363.11" y="100" width="12.89" height="78" fill="#fed9da" stroke="#fef7ef" stroke-width="2"/>
