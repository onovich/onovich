<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" data-style="ribbon" data-theme="paper" width="400" height="334" viewBox="0 0 400 334">
  <title id="title">Most Used Languages</title>
  <desc id="description">Language usage across 167 included public repositories. TypeScript: 32.7%; C#: 32.1%; JavaScript: 18.4%; HTML: 6.9%; Python: 4.7%; CSS: 1.5%; Other: 3.7%.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; }
    .title { fill: #024b81; font-size: 17px; font-weight: 700; letter-spacing: -0.2px; }
    .meta, .style-tag, .rank, .metric-label { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .meta { fill: #4d738d; font-size: 9.5px; letter-spacing: 0.9px; }
    .style-tag { fill: #fd7136; font-size: 9px; font-weight: 700; letter-spacing: 1px; }
    .label { fill: #024b81; font-size: 12px; font-weight: 650; }
    .value { fill: #4d738d; font-size: 11px; font-variant-numeric: tabular-nums; }
    .rank { fill: #fd7136; font-size: 9px; font-weight: 700; }
    .metric { fill: #024b81; font-size: 27px; font-weight: 750; font-variant-numeric: tabular-nums; }
    .metric-label { fill: #4d738d; font-size: 7px; letter-spacing: 0.7px; }
    .legend-rank { fill: #4d738d; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 8px; font-weight: 700; }
    .legend-label { fill: #024b81; font-size: 10.5px; font-weight: 600; }
    .legend-value { fill: #4d738d; font-size: 9.5px; font-variant-numeric: tabular-nums; }
    .axis-note { fill: #4d738d; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 9.5px; letter-spacing: 0.6px; }
    .part-label { font-size: 11px; font-weight: 700; }
    .part-rank { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 9px; font-weight: 800; }
    .part-value { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 10px; font-variant-numeric: tabular-nums; }
    .center-label { fill: #024b81; font-size: 12px; font-weight: 700; }
    .center-value { fill: #4d738d; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 9px; }
    .node-label { font-size: 9px; font-weight: 750; }
    .empty { fill: #4d738d; font-size: 11px; }
  </style>
  <rect class="card" x="0.5" y="0.5" width="399" height="333" rx="14" fill="#fef7ef" stroke="#a9c9dc"/>
  <rect x="24" y="20" width="4" height="35" rx="2" fill="#fd7136"/>
  <text class="title" x="38" y="35">Most Used Languages</text>
  <text class="meta" x="38" y="55">167 OF 168 PUBLIC REPOS</text>
  <text class="style-tag" text-anchor="end" x="376" y="30">RIBBON</text>
  <text class="axis-note" x="24" y="88">0%</text>
  <text class="axis-note" text-anchor="middle" x="200" y="88">COMPOSITION</text>
  <text class="axis-note" text-anchor="end" x="376" y="88">100%</text>
  <g data-role="ribbon-part">
