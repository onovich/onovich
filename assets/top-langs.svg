    <text class="legend-value" text-anchor="end" x="188" y="212">32.7%</text>
    <circle cx="212" cy="208" r="4" fill="#367db7"/>
    <text class="legend-label" x="224" y="212">C#</text>
    <text class="legend-value" text-anchor="end" x="372" y="212">32.1%</text>
    <circle cx="28" cy="234" r="4" fill="#6faddf"/>
    <text class="legend-label" x="40" y="238">JavaScript</text>
    <text class="legend-value" text-anchor="end" x="188" y="238">18.4%</text>
    <circle cx="212" cy="234" r="4" fill="#c9dce8"/>
    <text class="legend-label" x="224" y="238">HTML</text>
    <text class="legend-value" text-anchor="end" x="372" y="238">6.9%</text>
    <circle cx="28" cy="260" r="4" fill="#fed9da"/>
    <text class="legend-label" x="40" y="264">Python</text>
    <text class="legend-value" text-anchor="end" x="188" y="264">4.7%</text>
    <circle cx="212" cy="260" r="4" fill="#fd7136"/>
    <text class="legend-label" x="224" y="264">CSS</text>
    <text class="legend-value" text-anchor="end" x="372" y="264">1.5%</text>
    <circle cx="28" cy="286" r="4" fill="#fed9da"/>
    <text class="legend-label" x="40" y="290">Other</text>
    <text class="legend-value" text-anchor="end" x="188" y="290">3.7%</text>
