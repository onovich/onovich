    <rect data-role="composition-part" data-language="GLSL" data-share="0.0473" x="375.83" y="82" width="0.17" height="78" fill="#facbb0" stroke="#fef7ef" stroke-width="2"/>
  </g>
  <g data-role="legend" data-columns="2">
