    .percent { fill: #57606a; font: 400 12px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; }
    .track { fill: #eaeef2; }
  </style>
  <rect class="card" x="0.5" y="0.5" width="399" height="285" rx="6"/>
  <text class="title" x="24" y="30">Most Used Languages</text>
