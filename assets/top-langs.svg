  <rect class="track" x="24" y="105" width="352" height="6" rx="3"/>
  <rect x="24" y="105" width="113.58" height="6" rx="3" fill="#178600"/>
  <circle cx="29" cy="130" r="5" fill="#f1e05a"/>
  <text class="label" x="42" y="134">JavaScript</text>
