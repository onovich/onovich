name: Update RepoPalette languages

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-top-langs.yml"
  pull_request:
    paths:
      - ".github/workflows/update-top-langs.yml"

permissions: {}

concurrency:
  group: "repopalette-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    name: Validate RepoPalette integration
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate validation outputs
        id: repopalette
        uses: onovich/RepoPalette@e4b4dea8b8725de720a9d9d16468f4c5f4413209 # v0.6.1 implementation
        with:
          style: ribbon
          theme: paper
          show-branding: "true"
          coding-mode: split
          manual-languages: "C#,ShaderLab,HLSL,GLSL"
          output-directory: .tmp/repopalette

      - name: Verify validation outputs
        shell: bash
        env:
          REPOPALETTE_SVG: ${{ steps.repopalette.outputs.svg-path }}
          REPOPALETTE_DATA: ${{ steps.repopalette.outputs.data-path }}
          REPOPALETTE_REPOSITORY_COUNT: ${{ steps.repopalette.outputs.repository-count }}
        run: |
          test -s "$REPOPALETTE_SVG"
          test -s "$REPOPALETTE_DATA"
          grep -q 'data-style="ribbon"' "$REPOPALETTE_SVG"
          grep -q 'data-theme="paper"' "$REPOPALETTE_SVG"
          grep -q 'data-coding-mode="split"' "$REPOPALETTE_SVG"
          grep -q 'data-role="coding-group" data-group="manual"' "$REPOPALETTE_SVG"
          grep -q 'data-role="coding-group" data-group="vibe"' "$REPOPALETTE_SVG"
          grep -A1 'data-role="coding-overview-part" data-group="manual"' "$REPOPALETTE_SVG" | grep -q 'fill="#fd7136"'
          grep -A1 'data-role="coding-overview-part" data-group="vibe"' "$REPOPALETTE_SVG" | grep -q 'fill="#024b81"'
          grep -Eq 'data-language="C#"[^>]*fill="#fd7136"' "$REPOPALETTE_SVG"
          grep -Eq 'data-language="TypeScript"[^>]*fill="#024b81"' "$REPOPALETTE_SVG"
          glsl_is_sub_tenth="$(jq -r '
            . as $audit
            | ([.languages[] | select(.name == "GLSL") | .bytes][0] // 0) as $bytes
            | if $bytes > 0 and $audit.classification.groups.manual.totalBytes > 0
              then (($bytes / $audit.classification.groups.manual.totalBytes) * 100 < 0.1)
              else false
              end
          ' "$REPOPALETTE_DATA")"
          if [[ "$glsl_is_sub_tenth" == "true" ]]; then
            grep -A1 '>GLSL</text>' "$REPOPALETTE_SVG" | grep -q '&lt;0.1%'
            ! grep -A1 '>GLSL</text>' "$REPOPALETTE_SVG" | grep -q '>0.0%</text>'
          fi
          test "$(grep -c '>RepoPalette</text>' "$REPOPALETTE_SVG")" = "1"
          ! grep -q '>RIBBON</text>' "$REPOPALETTE_SVG"
          jq -e '
            .schemaVersion == 3
            and .username == "onovich"
            and .repositoryCount >= 1
            and .includedRepositoryCount >= 1
            and ((.repositoryScope.included | type) == "array")
            and ((.repositoryScope.excluded | type) == "array")
            and .classification.mode == "split"
            and .classification.source == "user-declared"
            and .classification.manualLanguages == ["C#", "ShaderLab", "HLSL", "GLSL"]
            and (.classification.groups.manual.totalBytes + .classification.groups.vibe.totalBytes == .totalBytes)
            and ((.classification.groups.manual.languages - ["C#", "ShaderLab", "HLSL", "GLSL"] | length) == 0)
            and ((.classification.groups.vibe.languages | map(select(. == "C#" or . == "ShaderLab" or . == "HLSL" or . == "GLSL")) | length) == 0)
          ' "$REPOPALETTE_DATA" > /dev/null
          test "$(jq -r '.repositoryCount' "$REPOPALETTE_DATA")" = "$REPOPALETTE_REPOSITORY_COUNT"

  update:
    name: Generate and commit RepoPalette outputs
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out triggering branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}

      - name: Generate RepoPalette outputs
        id: repopalette
        uses: onovich/RepoPalette@e4b4dea8b8725de720a9d9d16468f4c5f4413209 # v0.6.1 implementation
        with:
          style: ribbon
          theme: paper
          show-branding: "true"
          coding-mode: split
          manual-languages: "C#,ShaderLab,HLSL,GLSL"

      - name: Verify generated outputs
        shell: bash
        env:
          REPOPALETTE_SVG: ${{ steps.repopalette.outputs.svg-path }}
          REPOPALETTE_DATA: ${{ steps.repopalette.outputs.data-path }}
        run: |
          test -s "$REPOPALETTE_SVG"
          test -s "$REPOPALETTE_DATA"
          grep -q 'data-style="ribbon"' "$REPOPALETTE_SVG"
          grep -q 'data-theme="paper"' "$REPOPALETTE_SVG"
          grep -q 'data-coding-mode="split"' "$REPOPALETTE_SVG"
          grep -q 'data-role="coding-group" data-group="manual"' "$REPOPALETTE_SVG"
          grep -q 'data-role="coding-group" data-group="vibe"' "$REPOPALETTE_SVG"
          grep -A1 'data-role="coding-overview-part" data-group="manual"' "$REPOPALETTE_SVG" | grep -q 'fill="#fd7136"'
          grep -A1 'data-role="coding-overview-part" data-group="vibe"' "$REPOPALETTE_SVG" | grep -q 'fill="#024b81"'
          grep -Eq 'data-language="C#"[^>]*fill="#fd7136"' "$REPOPALETTE_SVG"
          grep -Eq 'data-language="TypeScript"[^>]*fill="#024b81"' "$REPOPALETTE_SVG"
          glsl_is_sub_tenth="$(jq -r '
            . as $audit
            | ([.languages[] | select(.name == "GLSL") | .bytes][0] // 0) as $bytes
            | if $bytes > 0 and $audit.classification.groups.manual.totalBytes > 0
              then (($bytes / $audit.classification.groups.manual.totalBytes) * 100 < 0.1)
              else false
              end
          ' "$REPOPALETTE_DATA")"
          if [[ "$glsl_is_sub_tenth" == "true" ]]; then
            grep -A1 '>GLSL</text>' "$REPOPALETTE_SVG" | grep -q '&lt;0.1%'
            ! grep -A1 '>GLSL</text>' "$REPOPALETTE_SVG" | grep -q '>0.0%</text>'
          fi
          test "$(grep -c '>RepoPalette</text>' "$REPOPALETTE_SVG")" = "1"
          ! grep -q '>RIBBON</text>' "$REPOPALETTE_SVG"
          jq -e '
            .schemaVersion == 3
            and .username == "onovich"
            and .repositoryCount >= 1
            and .includedRepositoryCount >= 1
            and .classification.mode == "split"
            and .classification.source == "user-declared"
            and .classification.manualLanguages == ["C#", "ShaderLab", "HLSL", "GLSL"]
            and (.classification.groups.manual.totalBytes + .classification.groups.vibe.totalBytes == .totalBytes)
          ' "$REPOPALETTE_DATA" > /dev/null

      - name: Commit changed outputs
        shell: bash
        env:
          REPOPALETTE_SVG: ${{ steps.repopalette.outputs.svg-path }}
          REPOPALETTE_DATA: ${{ steps.repopalette.outputs.data-path }}
        run: |
          files=("$REPOPALETTE_SVG" "$REPOPALETTE_DATA")
          for legacy in assets/top-langs-manual.svg assets/top-langs-vibe.svg; do
            if [[ -e "$legacy" ]] || git ls-files --error-unmatch -- "$legacy" >/dev/null 2>&1; then
              files+=("$legacy")
            fi
          done
          git add -A -- "${files[@]}"
          if git diff --cached --quiet; then
            echo "RepoPalette outputs are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(profile): update RepoPalette outputs"
          git push
