name: Update RepoPalette languages

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-top-langs.yml"
  pull_request:
    paths:
      - ".github/workflows/update-top-langs.yml"

permissions: {}

concurrency:
  group: "repopalette-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    name: Validate RepoPalette integration
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate validation outputs
        id: repopalette
        uses: onovich/RepoPalette@6ea7c65fe64653a023e3b5a8458a9c35c471ea50 # v0.2.0
        with:
          style: ribbon
          theme: paper
          output-directory: .tmp/repopalette

      - name: Verify validation outputs
        shell: bash
        env:
          REPOPALETTE_SVG: ${{ steps.repopalette.outputs.svg-path }}
          REPOPALETTE_DATA: ${{ steps.repopalette.outputs.data-path }}
          REPOPALETTE_REPOSITORY_COUNT: ${{ steps.repopalette.outputs.repository-count }}
        run: |
          test -s "$REPOPALETTE_SVG"
          test -s "$REPOPALETTE_DATA"
          grep -q '<svg' "$REPOPALETTE_SVG"
          grep -q 'data-style="ribbon"' "$REPOPALETTE_SVG"
          grep -q 'data-theme="paper"' "$REPOPALETTE_SVG"
          jq -e '
            .schemaVersion == 2
            and .username == "onovich"
            and .repositoryCount >= 1
            and .includedRepositoryCount >= 1
            and ((.repositoryScope.included | type) == "array")
            and ((.repositoryScope.excluded | type) == "array")
          ' "$REPOPALETTE_DATA" > /dev/null
          test "$(jq -r '.repositoryCount' "$REPOPALETTE_DATA")" = "$REPOPALETTE_REPOSITORY_COUNT"

  update:
    name: Generate and commit RepoPalette outputs
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out triggering branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}

      - name: Generate RepoPalette outputs
        id: repopalette
        uses: onovich/RepoPalette@6ea7c65fe64653a023e3b5a8458a9c35c471ea50 # v0.2.0
        with:
          style: ribbon
          theme: paper

      - name: Verify generated outputs
        shell: bash
        env:
          REPOPALETTE_SVG: ${{ steps.repopalette.outputs.svg-path }}
          REPOPALETTE_DATA: ${{ steps.repopalette.outputs.data-path }}
        run: |
          test -s "$REPOPALETTE_SVG"
          test -s "$REPOPALETTE_DATA"
          grep -q 'data-style="ribbon"' "$REPOPALETTE_SVG"
          grep -q 'data-theme="paper"' "$REPOPALETTE_SVG"
          jq -e '
            .schemaVersion == 2
            and .username == "onovich"
            and .repositoryCount >= 1
            and .includedRepositoryCount >= 1
          ' "$REPOPALETTE_DATA" > /dev/null

      - name: Commit changed outputs
        shell: bash
        env:
          REPOPALETTE_SVG: ${{ steps.repopalette.outputs.svg-path }}
          REPOPALETTE_DATA: ${{ steps.repopalette.outputs.data-path }}
        run: |
          git add -- "$REPOPALETTE_SVG" "$REPOPALETTE_DATA"
          if git diff --cached --quiet; then
            echo "RepoPalette outputs are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(profile): update RepoPalette outputs"
          git push
