name: Update RepoPalette languages

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-top-langs.yml"
  pull_request:
    paths:
      - ".github/workflows/update-top-langs.yml"

permissions: {}

concurrency:
  group: "repopalette-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    name: Validate RepoPalette integration
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate validation outputs
        id: repopalette
        uses: onovich/RepoPalette@33d2164aab51e3a6bb1ba6129d506a70d9973ded # v0.3.0
        with:
          style: ribbon
          theme: paper
          show-branding: "true"
          coding-mode: split
          manual-languages: "C#,ShaderLab,HLSL,GLSL"
          output-directory: .tmp/repopalette

      - name: Verify validation outputs
        shell: bash
        env:
          REPOPALETTE_SINGLE_SVG: ${{ steps.repopalette.outputs.svg-path }}
          REPOPALETTE_MANUAL_SVG: ${{ steps.repopalette.outputs.manual-svg-path }}
          REPOPALETTE_VIBE_SVG: ${{ steps.repopalette.outputs.vibe-svg-path }}
          REPOPALETTE_DATA: ${{ steps.repopalette.outputs.data-path }}
          REPOPALETTE_REPOSITORY_COUNT: ${{ steps.repopalette.outputs.repository-count }}
        run: |
          test -z "$REPOPALETTE_SINGLE_SVG"
          test -s "$REPOPALETTE_MANUAL_SVG"
          test -s "$REPOPALETTE_VIBE_SVG"
          test -s "$REPOPALETTE_DATA"
          grep -q 'data-style="ribbon"' "$REPOPALETTE_MANUAL_SVG"
          grep -q 'data-theme="paper"' "$REPOPALETTE_MANUAL_SVG"
          grep -q 'data-coding-group="manual"' "$REPOPALETTE_MANUAL_SVG"
          grep -q 'data-role="brand-watermark"' "$REPOPALETTE_MANUAL_SVG"
          ! grep -q '>RIBBON</text>' "$REPOPALETTE_MANUAL_SVG"
          grep -q 'data-style="ribbon"' "$REPOPALETTE_VIBE_SVG"
          grep -q 'data-theme="paper"' "$REPOPALETTE_VIBE_SVG"
          grep -q 'data-coding-group="vibe"' "$REPOPALETTE_VIBE_SVG"
          grep -q 'data-role="brand-watermark"' "$REPOPALETTE_VIBE_SVG"
          ! grep -q '>RIBBON</text>' "$REPOPALETTE_VIBE_SVG"
          jq -e '
            .schemaVersion == 3
            and .username == "onovich"
            and .repositoryCount >= 1
            and .includedRepositoryCount >= 1
            and ((.repositoryScope.included | type) == "array")
            and ((.repositoryScope.excluded | type) == "array")
            and .classification.mode == "split"
            and .classification.source == "user-declared"
            and .classification.manualLanguages == ["C#", "ShaderLab", "HLSL", "GLSL"]
            and (.classification.groups.manual.totalBytes + .classification.groups.vibe.totalBytes == .totalBytes)
            and ((.classification.groups.manual.languages - ["C#", "ShaderLab", "HLSL", "GLSL"] | length) == 0)
            and ((.classification.groups.vibe.languages | map(select(. == "C#" or . == "ShaderLab" or . == "HLSL" or . == "GLSL")) | length) == 0)
          ' "$REPOPALETTE_DATA" > /dev/null
          test "$(jq -r '.repositoryCount' "$REPOPALETTE_DATA")" = "$REPOPALETTE_REPOSITORY_COUNT"

  update:
    name: Generate and commit RepoPalette outputs
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out triggering branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}

      - name: Generate RepoPalette outputs
        id: repopalette
        uses: onovich/RepoPalette@33d2164aab51e3a6bb1ba6129d506a70d9973ded # v0.3.0
        with:
          style: ribbon
          theme: paper
          show-branding: "true"
          coding-mode: split
          manual-languages: "C#,ShaderLab,HLSL,GLSL"

      - name: Verify generated outputs
        shell: bash
        env:
          REPOPALETTE_SINGLE_SVG: ${{ steps.repopalette.outputs.svg-path }}
          REPOPALETTE_MANUAL_SVG: ${{ steps.repopalette.outputs.manual-svg-path }}
          REPOPALETTE_VIBE_SVG: ${{ steps.repopalette.outputs.vibe-svg-path }}
          REPOPALETTE_DATA: ${{ steps.repopalette.outputs.data-path }}
        run: |
          test -z "$REPOPALETTE_SINGLE_SVG"
          test -s "$REPOPALETTE_MANUAL_SVG"
          test -s "$REPOPALETTE_VIBE_SVG"
          test -s "$REPOPALETTE_DATA"
          grep -q 'data-style="ribbon"' "$REPOPALETTE_MANUAL_SVG"
          grep -q 'data-theme="paper"' "$REPOPALETTE_MANUAL_SVG"
          grep -q 'data-coding-group="manual"' "$REPOPALETTE_MANUAL_SVG"
          grep -q 'data-role="brand-watermark"' "$REPOPALETTE_MANUAL_SVG"
          ! grep -q '>RIBBON</text>' "$REPOPALETTE_MANUAL_SVG"
          grep -q 'data-style="ribbon"' "$REPOPALETTE_VIBE_SVG"
          grep -q 'data-theme="paper"' "$REPOPALETTE_VIBE_SVG"
          grep -q 'data-coding-group="vibe"' "$REPOPALETTE_VIBE_SVG"
          grep -q 'data-role="brand-watermark"' "$REPOPALETTE_VIBE_SVG"
          ! grep -q '>RIBBON</text>' "$REPOPALETTE_VIBE_SVG"
          jq -e '
            .schemaVersion == 3
            and .username == "onovich"
            and .repositoryCount >= 1
            and .includedRepositoryCount >= 1
            and .classification.mode == "split"
            and .classification.source == "user-declared"
            and .classification.manualLanguages == ["C#", "ShaderLab", "HLSL", "GLSL"]
            and (.classification.groups.manual.totalBytes + .classification.groups.vibe.totalBytes == .totalBytes)
          ' "$REPOPALETTE_DATA" > /dev/null

      - name: Commit changed outputs
        shell: bash
        env:
          REPOPALETTE_MANUAL_SVG: ${{ steps.repopalette.outputs.manual-svg-path }}
          REPOPALETTE_VIBE_SVG: ${{ steps.repopalette.outputs.vibe-svg-path }}
          REPOPALETTE_DATA: ${{ steps.repopalette.outputs.data-path }}
        run: |
          git add -- "$REPOPALETTE_MANUAL_SVG" "$REPOPALETTE_VIBE_SVG" "$REPOPALETTE_DATA"
          if git diff --cached --quiet; then
            echo "RepoPalette outputs are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(profile): update RepoPalette outputs"
          git push
